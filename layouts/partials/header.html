<header>
  <div class="header-title">
    <a href="{{ `` | relURL }}">{{ or .Site.Params.headTitle .Site.Params.author.name }}</a>
  </div>
  <div class="header-subtitle">{{ .Site.Params.Description }}</div>
</header>
<div class="row end-md header-items">
  <div class="header-item-left">
    <button id="theme-toggle" onclick="toggleTheme()" class="theme-toggle">
      Toggle
    </button>
  </div>

  {{ range .Site.Params.socials }}
  <div class="header-item">
    <a href="{{ if hasPrefix .link `http` }}{{ .link }}{{ else }}{{ .link | relURL }}{{ end }}" {{ if hasPrefix .link "http" }}target="_blank" rel="noreferrer"{{ end }}>{{ .name }}</a>
  </div>
  {{ end }}
</div>
<div class="header-line"></div>
